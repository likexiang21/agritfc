modLoader = "javafml"
loaderVersion = "[4,)"
license = "EUPL-1.2"

[[mixins]]
config = "tfcagricultureplus.mixins.json"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "TFC Agriculture Plus"
authors = "likexiang21"
description = '''TFC Agriculture Plus - a crop, spice, nut and mushroom production layer built on TerraFirmaCraft and TFC Farming Plus. Adds crop harvesting/replanting chains, seed treatment and nursery trays, wet grass and grain bundles, 82 crop-waste / 10 bush-waste items, 15 wild mushrooms with cultivation bags, 20 spice crops/trees, 3 nut trees and TFC/A/AFC nut-leaf states.'''

[[dependencies.${modId}]]
    modId = "tfcfarmingplus"
    type = "required"
    versionRange = "${aVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "tfc"
    type = "required"
    versionRange = "${tfcVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "firmalife"
    type = "required"
    versionRange = "${firmalifeVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "afc"
    type = "required"
    versionRange = "[2.1.2,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "patchouli"
    type = "required"
    versionRange = "${patchouliVersionRange}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoForgeVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraftVersionRange}"
    ordering = "AFTER"
    side = "BOTH"
# JEI is OPTIONAL -- same declaration style as TFC (type=optional, side=CLIENT).
# Our mod must load fine without it.
[[dependencies.${modId}]]
    modId = "jei"
    type = "optional"
    versionRange = "[19.25.0.321,)"
    ordering = "NONE"
    side = "CLIENT"
